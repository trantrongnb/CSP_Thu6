[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-part-fsl"
version = "0.1.0"
description = "Motion–Part FSL: motion-guided TEAM for few-shot sign language recognition"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "torch>=2.3", "torchvision>=0.18", "PyYAML>=6", "opencv-python-headless>=4.8,<4.12"]

[project.optional-dependencies]
landmarks = ["mediapipe==0.10.21"]
dev = ["pytest>=8"]

[project.scripts]
mpfsl-preprocess = "motion_part_fsl.preprocessing.pipeline:main"
mpfsl-train = "motion_part_fsl.engine:train_main"
mpfsl-evaluate = "motion_part_fsl.engine:evaluate_main"
mpfsl-episodes = "motion_part_fsl.datasets.episodic_sampler:main"
mpfsl-smoke = "motion_part_fsl.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
